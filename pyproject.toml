[project]
name = "hotas-kneeboard"
version = "0.3.0"
description = "DCS World kneeboard pages and printable sheets of your HOTAS bindings, drawn on your devices"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pyinstaller>=6.11",
    "pytest>=8.3",
    "ruff>=0.15",
]
docs = [
    "mike>=2.0,<3",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocs-static-i18n>=1.0,<2",
]

[project.scripts]
hotas-kneeboard = "hotas_kneeboard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hotas_kneeboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["A", "E", "C90", "I", "W", "F", "B", "N", "PL", "UP"]
ignore = ["E501", "PLR2004", "PLC0415", "PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
# the routes are closures of create_app: each one counts in its complexity
"hotas_kneeboard/app.py" = ["C901", "PLR0915"]
