name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # the binding engine runs on Lua 5.1, the interpreter DCS ships (bin/luae.exe)
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Pytest
        env:
          DCS_TEST_LUA: lua5.1
        run: uv run pytest

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vue-tsc -b
      - run: npx vitest run
      - run: npx vite build
